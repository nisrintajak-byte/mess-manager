  @media (prefers-color-scheme: dark) { :root { --bg:#0F1714; --card:#18231F; --ink:#E8EFEA; --muted:#A3B1AA; --line:#2C3A35; --accent:#4FB89B; --danger:#FF9A90; --dangerBg:#3A1816; --okBg:#14332B; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Naskh Arabic", "Noto Sans Devanagari", sans-serif; }
  html[lang=ur] body { font-family: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Noto Naskh Arabic", system-ui, sans-serif; line-height: 2; }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:16px 0; }
  .muted { color:var(--muted); font-size:14px; }
  ul { padding-inline-start: 20px; margin: 8px 0; }
  li { margin: 6px 0; }
  label { display:block; font-weight:600; margin: 8px 0 6px; }
  input[type=email] { width:100%; padding:12px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  button { width:100%; margin-top:12px; padding:13px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  button.danger { background:var(--danger); }
  button:disabled { opacity:.55; cursor:default; }
  .notice { padding:12px; border-radius:10px; margin:12px 0; }
  .notice.err { background:var(--dangerBg); color:var(--danger); }
  .notice.ok { background:var(--okBg); }
  .langs { display:flex; gap:8px; flex-wrap:wrap; }
  .langs a { color:var(--accent); text-decoration:none; padding:4px 10px; border:1px solid var(--line); border-radius:999px; font-size:14px; }
  .langs a[aria-current] { background:var(--accent); color:#fff; border-color:var(--accent); }
  .check { display:flex; gap:10px; align-items:flex-start; margin-top:12px; }
  .check input { width:20px; height:20px; margin-top:4px; flex:none; }
  [hidden] { display:none !important; }
</style>
</head>

  const NAMES = { en: 'English', ar: 'العربية', ur: 'اردو', hi: 'हिन्दी' };
  const params = new URLSearchParams(location.search);
  const browser = (navigator.language || 'en').slice(0, 2);
  let lang = T[params.get('lang')] ? params.get('lang') : T[browser] ? browser : 'en';
  const token = new URLSearchParams(location.hash.slice(1)).get('t');

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' || lang === 'ur' ? 'rtl' : 'ltr';
    document.title = t.title;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
    const nav = document.getElementById('langs');
    nav.innerHTML = '';
    for (const code of Object.keys(NAMES)) {
      const a = document.createElement('a');
      a.href = '?lang=' + code + location.hash;
      a.textContent = NAMES[code];
      a.lang = code;
      if (code === lang) a.setAttribute('aria-current', 'true');
      a.addEventListener('click', (e) => { e.preventDefault(); lang = code; history.replaceState(null, '', a.href); render(); });
      nav.appendChild(a);
    }
  }

  async function rpc(name, args) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) throw Object.assign(new Error('rpc'), { status: res.status, body });
    return body;
  }

  document.getElementById('reqForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('reqBtn');
    btn.disabled = true;
    document.getElementById('reqErr').hidden = true;
    try {
      await rpc('request_account_deletion', { p_email: document.getElementById('email').value });
      document.getElementById('reqForm').hidden = true;
      document.getElementById('reqDone').hidden = false;
    } catch {
      document.getElementById('reqErr').hidden = false;
      btn.disabled = false;
    }
  });

  if (token) {
    document.getElementById('confirm').hidden = false;
    const agree = document.getElementById('agree');
    const btn = document.getElementById('confirmBtn');
    const msg = document.getElementById('confirmMsg');
    agree.addEventListener('change', () => { btn.disabled = !agree.checked; });
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      const t = T[lang];
      const show = (text, ok) => { msg.hidden = false; msg.className = 'notice ' + (ok ? 'ok' : 'err'); msg.textContent = text; };
      try {
        const r = await rpc('confirm_account_deletion', { p_token: token });
        if (r && r.ok) {
          show(t.done, true);
          history.replaceState(null, '', location.pathname + location.search);
          agree.disabled = true;
          return;
        }
        if (r && r.error === 'last_admin') show(t.lastAdmin.replace('{rooms}', (r.rooms || []).join(', ')), false);
        else show(t.invalid, false);
      } catch (err) {
        show(err && err.status === 404 ? t.notReady : t.error, false);
      }
      btn.disabled = !agree.checked;
    });
  }
  render();
})();
