name: Android build status

# Dev helper: reports the latest Android builds on Expo (status + download link) as notices.
# Trigger: change .github/android-status-request and push.

on:
  push:
    paths: ['.github/android-status-request']
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: |
          npx --yes eas-cli@latest whoami | sed 's/^/::notice title=expo account::/'
          npx --yes eas-cli@latest build:list --platform android --limit 3 --json --non-interactive > builds.json 2> err.txt || true
          head -c 600 err.txt | tr '\n' ' ' | sed 's/^/::notice title=stderr::/'; echo
          head -c 300 builds.json | tr '\n' ' ' | sed 's/^/::notice title=raw::/'; echo
          node -e "
            const b=JSON.parse(require('fs').readFileSync('builds.json','utf8')||'[]');
            for (const x of b) console.log('::notice title=build '+x.id.slice(0,8)+'::'+x.status+' | '+(x.artifacts?.buildUrl||x.artifacts?.applicationArchiveUrl||'no file yet')+' | '+(x.error?.message||''));
          "
      - name: Logs of failed builds
        run: |
          node -e "
            const b=JSON.parse(require('fs').readFileSync('builds.json','utf8')||'[]');
            console.log(b.filter(x=>x.status==='ERRORED').slice(0,1).map(x=>x.id).join(' '));
          " > errored.txt
          for id in $(cat errored.txt); do
            npx --yes eas-cli@latest build:view "$id" --json --non-interactive > view.json 2>/dev/null || continue
            node -e "const v=JSON.parse(require('fs').readFileSync('view.json','utf8'));for(const u of (v.logFiles||[]))console.log(u)" > urls.txt
            for u in $(cat urls.txt); do curl -sL "$u"; done > log.txt
            grep -iE 'npm (error|err)|ERESOLVE|error|failed' log.txt | grep -v 'level\":30' | tail -n 25 | cut -c1-300 | sed "s/^/::warning title=log ${id:0:8}::/"
          done
