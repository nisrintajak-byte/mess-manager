name: APK size

# Reports the size of an Android test app (PRD §21: install size under 40 MB).
on:
  workflow_dispatch:
    inputs:
      url:
        description: APK download link
        required: true

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Download and measure
        env:
          URL: ${{ inputs.url }}
        run: |
          curl -sSL -o app.apk "$URL"
          bytes=$(stat -c %s app.apk)
          unzip -l app.apk > list.txt
          echo "::notice title=apk size::$((bytes / 1024 / 1024)) MB download ($bytes bytes)"
          # what one phone gets from Google Play (one CPU type): everything except other ABIs' libraries
          common=$(awk '$4 !~ /^lib\// && $1 ~ /^[0-9]+$/ {s+=$1} END {print s}' list.txt)
          arm64=$(awk '$4 ~ /^lib\/arm64-v8a\// {s+=$1} END {print s}' list.txt)
          echo "::notice title=estimated phone install (arm64, uncompressed)::$(( (common + arm64) / 1024 / 1024 )) MB (app files $((common/1024/1024)) MB + arm64 libraries $((arm64/1024/1024)) MB)"
          awk '$4 !~ /^lib\// && $1 ~ /^[0-9]+$/' list.txt | sort -k1 -n -r | head -12 | awk '{printf "%d KB %s~", $1/1024, $4}' | sed 's/^/::notice title=largest app files::/'
          echo
          sort -k1 -n -r list.txt | head -8 | awk '{printf "%d KB %s~", $1/1024, $4}' | sed 's/^/::notice title=largest files::/'
          echo
