name: Deploy web preview

# Publishes two web previews to GitHub Pages so the founder can test on any phone browser:
#   stable (version under test): https://nisrintajak-byte.github.io/mess-manager/
#   next   (version in progress): https://nisrintajak-byte.github.io/mess-manager/next/
# Runs after CI succeeds on any of those branches. `workflow_run` executes in the context of
# the default branch, which satisfies the github-pages environment protection rule.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, 'version/**']
  workflow_dispatch:

env:
  STABLE_REF: main
  NEXT_REF: version/v0.4-languages-themes-security

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'version/v0.4-languages-themes-security' ||
        false))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.STABLE_REF }}
          path: stable
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NEXT_REF }}
          path: next
      - name: Build stable preview
        working-directory: stable
        run: |
          npm ci
          npx expo export --platform web --output-dir ../dist
      - name: Build next preview
        working-directory: next
        run: |
          npm ci
          node -e "const f='app.json';const a=require('./'+f);a.expo.experiments={...(a.expo.experiments||{}),baseUrl:'/mess-manager/next'};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
          npx expo export --platform web --output-dir ../dist/next
      - name: SPA fallback for deep links
        run: |
          cp dist/next/index.html dist/next/404.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open both live previews in a real browser
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch();
          let failed = false;
          for (const [name, url] of [
            ['stable', 'https://nisrintajak-byte.github.io/mess-manager/'],
            ['next', 'https://nisrintajak-byte.github.io/mess-manager/next/'],
          ]) {
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            page.on('pageerror', (e) => console.log(`::warning::${name} page error: ${e.message}`));
            let ok = false;
            for (let i = 0; i < 10 && !ok; i++) {
              await page.goto(url, { waitUntil: 'networkidle' });
              ok = (await page.getByText('Welcome back').count()) > 0;
              if (!ok) await page.waitForTimeout(15000);
            }
            await page.screenshot({ path: `${name}.png`, fullPage: true });
            if (ok) console.log(`::notice::${name} preview OK — login screen rendered`);
            else { console.log(`::error::${name} preview did not render`); failed = true; }
          }
          await browser.close();
          process.exit(failed ? 1 : 0);
          JS
          node smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-screenshots
          path: '*.png'
