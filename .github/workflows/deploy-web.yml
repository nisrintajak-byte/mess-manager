name: Deploy web preview

# Publishes the web build to GitHub Pages so the founder can test on any phone browser:
# https://nisrintajak-byte.github.io/mess-manager/
#
# Runs after CI succeeds on main or a version/** branch. `workflow_run` always executes
# in the context of the default branch, which satisfies the github-pages environment rule,
# while we check out and build the exact commit that passed CI.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Only main and the version currently under founder test publish the preview.
    branches: [main, 'version/v0.1-core-mvp']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export web build
        run: npx expo export --platform web --output-dir dist
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Open the live site in a real browser
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const url = 'https://nisrintajak-byte.github.io/mess-manager/';
          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
          const errors = [];
          page.on('pageerror', (e) => errors.push(e.message));
          for (let i = 0; i < 10; i++) {
            await page.goto(url, { waitUntil: 'networkidle' });
            if (await page.getByText('Welcome back').count()) break;
            await page.waitForTimeout(15000); // Pages CDN can take a moment
          }
          await page.screenshot({ path: 'login.png', fullPage: true });
          const ok = (await page.getByText('Welcome back').count()) > 0;
          for (const e of errors) console.log(`::warning::page error: ${e}`);
          if (!ok) { console.log('::error::Login screen did not render on the live site'); process.exit(1); }
          console.log('::notice::Live site OK — login screen rendered');
          await browser.close();
          JS
          node smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-screenshot
          path: login.png
