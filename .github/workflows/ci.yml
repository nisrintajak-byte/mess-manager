name: CI

on:
  push:
    branches: [main, 'version/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: |
          npx eslint . -f json -o eslint.json || {
            node -e "for (const f of require('./eslint.json')) for (const m of f.messages) console.log('::error file=' + f.filePath.replace(process.cwd() + '/', '') + ',line=' + m.line + '::' + m.ruleId + ' ' + m.message)";
            exit 1;
          }
      - name: Unit tests
        run: npm test -- --ci
      - name: Web build (smoke)
        run: |
          if ! npx expo export --platform web --output-dir dist > web-build.log 2>&1; then
            grep -iE "error|cannot|failed|unable" web-build.log | head -15 | sed 's/^/::error title=web-build::/'
            tail -n 15 web-build.log | sed 's/^/::error title=web-build-tail::/'
            exit 1
          fi
      - name: Android bundle + native config (catches phone-only errors before an EAS build)
        run: |
          npx expo export --platform android --output-dir /tmp/android-export > /tmp/android-export.log 2>&1 || { tail -40 /tmp/android-export.log; echo "::error::Android JS bundle failed"; exit 1; }
          npx expo prebuild --platform android --no-install --clean > /tmp/prebuild.log 2>&1 || { tail -40 /tmp/prebuild.log; echo "::error::Android prebuild failed"; exit 1; }
          test -f android/app/google-services.json || { echo "::error::google-services.json not copied"; exit 1; }
          ls android/app/src/main/res/raw/ | grep -q need_alert || { echo "::error::need_alert sound missing"; exit 1; }
          rm -rf android
      - name: Account deletion web page is included
        run: |
          test -f dist/delete-account/index.html && test -f dist/sw.js
          test -f dist/privacy/index.html && test -f dist/terms/index.html
      - name: Legal web pages match the app's texts
        run: |
          python3 scripts/build-legal-pages.py
          git diff --exit-code -- public/privacy public/terms

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS/behaviour tests
        run: |
          psql --version
          if ! scripts/test-db.sh > db-test.log 2>&1 || ! grep -q "ALL DB TESTS PASSED" db-test.log; then
            tail -n 15 db-test.log | sed 's/^/::error title=db-test::/'
            exit 1
          fi
          cat db-test.log
