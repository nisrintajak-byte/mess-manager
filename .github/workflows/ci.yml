name: CI

on:
  push:
    branches: [main, 'version/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: |
          npx eslint . -f json -o eslint.json || {
            node -e "for (const f of require('./eslint.json')) for (const m of f.messages) console.log('::error file=' + f.filePath.replace(process.cwd() + '/', '') + ',line=' + m.line + '::' + m.ruleId + ' ' + m.message)";
            exit 1;
          }
      - name: Unit tests
        run: npm test -- --ci
      - name: Web build (smoke)
        run: npx expo export --platform web --output-dir dist

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + RLS/behaviour tests
        run: scripts/test-db.sh | grep -q "ALL DB TESTS PASSED"
