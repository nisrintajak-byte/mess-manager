name: Android test app

# Builds an installable Android test app (APK) on Expo's servers (EAS Build).
# Needs the repository secret EXPO_TOKEN (founder's free Expo account).
# Trigger: change .github/android-build-request and push (or run manually).
# The download link appears as a notice on this run and on expo.dev → Builds.

on:
  push:
    paths: ['.github/android-build-request']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expo token present
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Add the EXPO_TOKEN repository secret first"; exit 1; fi
      - run: npm ci
      - name: Link the Expo project (first time only)
        run: |
          if ! node -e "process.exit(require('./app.json').expo.extra?.eas?.projectId ? 0 : 1)"; then
            npx --yes eas-cli@latest init --non-interactive --force
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: link Expo project [skip ci]" && git pull --rebase && git push || true
          fi
      - name: Start the Android build
        run: |
          npx --yes eas-cli@latest build -p android --profile preview --non-interactive --no-wait --json > build.json || { cat build.json; exit 1; }
          node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'))[0]||{};console.log('::notice title=Android build::https://expo.dev/accounts/'+(b.project?.ownerAccount?.name||'')+'/projects/'+(b.project?.slug||'mess-manager')+'/builds/'+b.id)"
