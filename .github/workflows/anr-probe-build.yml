name: ANR probe (build from source)

# Builds a release APK of this branch on the runner (no EAS build needed), then runs the
# ANR probe on an emulator. Signs in with the QA_EMAIL / QA_PASSWORD repository secrets if set.
# Results are committed to the branch under qa/anr-probe-build/.

on:
  push:
    paths: ['.github/anr-probe-build-request']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: QA experiment patch (only when .github/anr-experiment-on exists)
        run: if [ -f .github/anr-experiment-on ]; then bash .github/anr-experiment.sh; fi
      - name: Build release APK (x86_64 only, for the emulator)
        run: |
          npx expo prebuild --platform android --no-install --clean > prebuild.log 2>&1 || { tail -40 prebuild.log; exit 1; }
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q > ../gradle.log 2>&1 || { tail -60 ../gradle.log; exit 1; }
          cp app/build/outputs/apk/release/app-release.apk ../app.apk && ls -la ../app.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          QA_EXPERIMENT: ${{ hashFiles('.github/anr-experiment-on') }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          cores: 2
          ram-size: 3072M
          disable-animations: true
          script: bash .github/anr-probe.sh
      - name: Save results to the branch
        if: always()
        run: |
          rm -rf qa/anr-probe-build && mkdir -p qa/anr-probe-build && cp -r out/* qa/anr-probe-build/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/anr-probe-build && git commit -m "qa: ANR probe (build) results [skip ci]" && git pull --rebase --autostash -q && git push || true
